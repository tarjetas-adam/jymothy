<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JYMOTHY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120E0A;
  --bg-2:#0C0908;
  --card:#1D1811;
  --card-2:#271F16;
  --line:#332B20;
  --text:#F4EEE2;
  --text-dim:#9A907E;
  --text-faint:#5C5346;
  --push:#E2542C;
  --push-dim:#5A2A1B;
  --pull:#D6A93C;
  --pull-dim:#4F3F1A;
  --prog:#D99B4B;
  --prog-dim:#2A2F52;
  --danger:#D6472D;
  --radius:18px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
body.session-theme,html.session-theme{
  --bg:#F0782B;
  --bg-2:#D9631A;
  --card:#C2540E;
  --card-2:#B04A0A;
  --line:#C2540E;
  --text:#FFF9F2;
  --text-dim:#FFDAB0;
  --text-faint:#E29867;
  --push:#A8460C;
  --push-dim:#7A3006;
  --pull:#8A3D0E;
  --pull-dim:#71330B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body.training-mode{position:relative;}
body.training-mode::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  transition:opacity .6s ease;opacity:0;
}
body.training-mode.cat-push::before{
  opacity:1;
  background:radial-gradient(ellipse 700px 320px at 50% 0%, var(--push-dim) 0%, var(--bg) 62%);
}
body.training-mode.cat-pull::before{
  opacity:1;
  background:radial-gradient(ellipse 700px 320px at 50% 0%, var(--pull-dim) 0%, var(--bg) 62%);
}

body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overscroll-behavior-y:none;
}
#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  padding-top:calc(var(--safe-top) + 22px);
  padding-bottom:calc(var(--safe-bottom) + 40px);
  position:relative;
}
.expand-old-layer{
  position:fixed;inset:0;z-index:40;overflow:hidden;pointer-events:none;
}
.expand-top-layer{position:relative;z-index:50;}
.swipe-card{
  position:relative;z-index:50;
  border-radius:26px 26px 14px 14px;
  overflow:hidden;
  background:var(--bg);
  box-shadow:0 18px 40px rgba(28,20,13,.5);
}
.eyebrow{
  font-family:'Space Mono',monospace;
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  font-weight:700;
}
.eyebrow.push{color:var(--push);}
.eyebrow.pull{color:var(--pull);}
.eyebrow.prog{color:var(--prog);}
.eyebrow.neutral{color:var(--text-dim);}
h1.hero{
  font-family:'Anton',sans-serif;
  font-weight:400;
  text-transform:uppercase;
  font-size:66px;
  line-height:0.92;
  letter-spacing:.01em;
  margin:8px 0 0 0;
}
.sub{color:var(--text-dim);font-size:15px;line-height:1.4;margin-top:10px;}
.px{padding-left:24px;padding-right:24px;}
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:0 24px 14px 24px;
  min-height:20px;
}
.iconbtn{
  background:none;border:none;color:var(--text-dim);
  font-size:22px;line-height:1;padding:6px;margin:-6px;
  cursor:pointer;border-radius:10px;
}
.iconbtn:active{background:var(--card-2);}
.topbar .title{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);flex:1;}
.card{
  position:relative;
  background:var(--card);
  border-radius:var(--radius);
  overflow:hidden;
  padding:20px 20px 20px 24px;
  margin:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  cursor:pointer;
  transition:background .15s, filter .55s ease, opacity .55s ease, transform .55s ease;
}
.card::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--line);
  transition:width .95s cubic-bezier(.34,1.56,.64,1);
}
.card:active{background:var(--card-2);}
.card:active::before,.card:hover::before{width:18px;}
.card.push::before{background:var(--push);}
.card.pull::before{background:var(--pull);}
.card.prog::before{background:var(--prog);}
.card.menu::before{display:none;}
.menu-slot{
  position:relative;
  margin:14px 24px;
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--card);
  transition:filter .55s ease, opacity .55s ease;
}
.menu-slot::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:50%;
  background:var(--push);
  border-radius:var(--radius) 0 0 var(--radius);
}
.menu-slot.pull::before{background:var(--pull);}
.menu-slot.slot-dim{filter:blur(3px);opacity:.35;}
.menu-slot .card.menu{
  margin:0;width:100%;
  border-top-right-radius:0;
  border-bottom-right-radius:0;
  transform:translateX(6px);
  transition:transform .85s cubic-bezier(.34,1.56,.64,1);
}
.menu-slot:hover .card.menu,
.menu-slot .card.menu:active{
  transform:translateX(16px);
}
.menu-slot .card.menu-selected{transform:translateX(16px) scale(1.02);}
.menu-slot:hover .card.menu .chev,
.menu-slot .card.menu:active .chev{transition:opacity .35s ease .25s;}
.card .ct{flex:1;}
.card .ct .t{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:22px;letter-spacing:.01em;}
.card .ct .d{color:var(--text-dim);font-size:13px;margin-top:4px;}
.card .chev{color:var(--text-faint);font-size:22px;transition:opacity .3s ease;}
.card:active .chev,.card:hover .chev{transition:opacity .35s ease .71s;}
.card:active .chev,.card:hover .chev{opacity:0;}
.section-label{
  font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--text-faint);
  padding:18px 24px 6px 24px;
}
.empty{
  margin:30px 24px;padding:30px 20px;border:1.5px dashed var(--line);
  border-radius:var(--radius);text-align:center;color:var(--text-dim);font-size:14px;
}
.empty .big{font-family:'Anton',sans-serif;font-size:20px;text-transform:uppercase;color:var(--text);margin-bottom:6px;}
.btn{
  font-family:'Inter',sans-serif;font-weight:700;font-size:15px;
  border:none;border-radius:14px;padding:16px 20px;cursor:pointer;
  width:100%;text-align:center;
  transition:transform .3s ease, opacity .3s ease;
}
.btn:active{transform:scale(.96);opacity:.85;}
.btn.primary{background:var(--push);color:#160B07;}
.btn.primary.pull{background:var(--pull);}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);}
.btn.small{padding:10px 16px;font-size:13px;width:auto;}
.btn:disabled{opacity:.35;}
.btn-row{padding:16px 24px;display:flex;gap:10px;}
.choice{
  margin:10px 24px;padding:26px 20px;border-radius:var(--radius);
  font-family:'Anton',sans-serif;font-size:26px;text-transform:uppercase;
  text-align:center;cursor:pointer;border:2px solid var(--line);color:var(--text);
}
.choice.push{border-color:var(--push);color:var(--push);}
.choice.pull{border-color:var(--pull);color:var(--pull);}
.choice:active{transform:scale(.98);}
.list-row{
  margin:8px 24px;padding:16px 18px;border-radius:14px;background:var(--card);
  display:flex;align-items:center;gap:12px;border:1.5px solid transparent;
  transition:transform .5s ease, background .5s ease, border-color .5s ease;
}
.list-row:active{transform:scale(.97);}
.list-row.selected{border-color:var(--push);background:var(--push-dim);}
.list-row.selected.pull{border-color:var(--pull);background:var(--pull-dim);}
@keyframes rowTogglePop{
  0%{ transform:scale(1); }
  45%{ transform:scale(1.035); }
  100%{ transform:scale(1); }
}
.list-row.row-pop{ animation:rowTogglePop .45s ease; }
.list-row .name{flex:1;font-size:15px;font-weight:600;}
.check{
  width:22px;height:22px;border-radius:7px;border:2px solid var(--text-faint);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;
}
.list-row.selected .check{background:var(--push);border-color:var(--push);color:#160B07;}
.list-row.selected.pull .check{background:var(--pull);border-color:var(--pull);}
.addrow{margin:14px 24px;display:flex;gap:8px;}
.addrow input{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:12px 14px;font-family:'Inter';font-size:14px;
}
.reorder-item{
  margin:8px 24px;padding:14px 16px;border-radius:14px;background:var(--card);
  display:flex;align-items:center;gap:12px;touch-action:none;user-select:none;
  border-left:4px solid var(--line);
}
.reorder-item.push{border-left-color:var(--push);}
.reorder-item.pull{border-left-color:var(--pull);}
.reorder-item.dragging{background:var(--card-2);box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5;position:relative;}
.reorder-item .grip{color:var(--text-faint);font-size:18px;letter-spacing:2px;flex-shrink:0;}
.reorder-item .name{flex:1;font-weight:600;font-size:15px;}
.reorder-item .meta{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-dim);}
.reorder-item .del{color:var(--text-faint);font-size:20px;padding:4px 6px;}
.field-label{font-size:12px;color:var(--text-dim);margin:4px 0 8px 0;font-weight:600;}
.baseline-row{
  margin:8px 24px;padding:14px 16px;border-radius:14px;background:var(--card);
  display:flex;align-items:center;gap:10px;
}
.set-inputs{display:flex;align-items:center;gap:6px;flex:1;}
.set-inputs input{
  background:var(--bg-2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:'Space Mono',monospace;font-size:15px;text-align:center;padding:9px 4px;width:56px;
}
.set-inputs input.reps{width:64px;}
.set-inputs .x{color:var(--text-faint);font-family:'Space Mono',monospace;}
.set-num{font-family:'Space Mono',monospace;color:var(--text-faint);font-size:12px;width:14px;flex-shrink:0;}
.repbar{display:flex;align-items:center;gap:3px;height:8px;margin-top:2px;}
.repbar .seg{height:100%;border-radius:3px;background:var(--push);}
.repbar.pull .seg{background:var(--pull);}
.repbar .gap{width:5px;color:var(--text-faint);font-size:9px;display:flex;align-items:center;justify-content:center;}
.delset{color:var(--text-faint);font-size:16px;padding:4px;}

.set-line{
  margin:8px 24px;padding:13px 16px;border-radius:14px;background:var(--card);
  min-height:60px;display:flex;align-items:center;gap:10px;
  transition:transform .5s ease, opacity .5s ease;
}
.set-line.pressed{transform:scale(.97);opacity:.85;}
@keyframes setNewIn{
  from{ opacity:0; transform:scale(.9) translateY(8px); }
  to{ opacity:1; transform:scale(1) translateY(0); }
}
.set-new{ animation:setNewIn .5s cubic-bezier(.34,1.4,.64,1) both; }
@keyframes exNewIn{
  from{ opacity:0; transform:scale(.92) translateY(14px); }
  to{ opacity:1; transform:scale(1) translateY(0); }
}
.ex-new{ animation:exNewIn 1.1s cubic-bezier(.16,1,.3,1) both; }
.ex-new-first{ animation-duration:4.5s; }
.set-edit-session{min-height:60px;box-sizing:border-box;transition:transform .5s ease, opacity .5s ease;}
.set-edit-session.pressed{transform:scale(.97);opacity:.85;}
.set-edit-session .numfield-plain,.set-edit-session .x{font-size:15px;}
.set-summary{
  flex:1;align-self:stretch;font-family:'Space Mono',monospace;font-size:15px;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.set-summary .pausemark{color:var(--text-faint);font-size:12px;}
.logcheck{
  width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:none;
  color:var(--text-faint);font-size:16px;cursor:pointer;flex-shrink:0;
}
.logcheck.push{border-color:var(--push);color:var(--push);}
.logcheck.pull{border-color:var(--pull);color:var(--pull);}
.logcheck.invisible{visibility:hidden;pointer-events:none;}
.delsetbtn{
  background:none;border:1.5px solid var(--danger);color:var(--danger);border-radius:8px;
  font-size:10.5px;font-weight:700;font-family:'Space Mono',monospace;
  height:34px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;cursor:pointer;box-sizing:border-box;white-space:nowrap;
}
.delsetbtn-x{
  height:26px;width:26px;padding:0;font-size:15px;font-weight:400;line-height:1;
  background:var(--card);border:1px solid var(--line);color:var(--text);
  transition:background 1s ease, transform 1s ease;
}
.delsetbtn-x:active{background:var(--text);color:var(--card-2);transform:scale(.9);}

.set-edit{
  margin:8px 24px;padding:13px 14px;border-radius:14px;background:var(--card-2);
  display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow:hidden;
}
.set-edit-boxed{border:.8px solid var(--line);background:var(--card-2);padding:10px 16px;}
.set-edit-session{gap:10px;}
.numfield-plain{
  background:none;border:none;padding:0;margin:0;
  color:var(--text);font-family:'Space Mono',monospace;font-size:13px;
  height:auto;cursor:pointer;flex-shrink:0;border-radius:4px;
  transition:opacity .5s ease;
}
.numfield-plain:active{opacity:.6;}
.set-edit .x{color:var(--text);font-family:'Space Mono',monospace;font-size:13px;flex-shrink:0;}
.numfield{
  background:var(--bg-2);border:1.5px solid var(--text);border-radius:9px;
  color:var(--text);font-family:'Space Mono',monospace;font-size:13px;
  height:34px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;box-sizing:border-box;min-width:0;
}
.numfield:active{background:var(--card);}
.pausebtn{
  background:none;border:1.5px solid var(--text);color:var(--text);border-radius:8px;
  font-size:10.5px;font-weight:700;font-family:'Space Mono',monospace;
  height:34px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;cursor:pointer;box-sizing:border-box;white-space:nowrap;
  transition:background .1s ease, color .1s ease, transform .1s ease;
}
.pausebtn:active{background:var(--text);color:var(--card-2);transform:scale(.95);}
.pausebtn-fixed{
  width:26px;height:26px;padding:0;font-size:15px;font-weight:400;
  background:var(--card);border:1px solid var(--line);color:var(--text);
  transition:background 1s ease, color 1s ease, transform 1s ease;
}
.collapsebtn{
  background:none;border:1.5px solid var(--text);border-radius:8px;
  color:var(--text);font-family:'Space Mono',monospace;font-size:10.5px;
  height:34px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;box-sizing:border-box;white-space:nowrap;
}
.dc-group{display:flex;gap:5px;margin-left:auto;flex-shrink:0;}
.numpad-card{width:88%;max-width:340px;}
.numpad-display{
  font-family:'Space Mono',monospace;font-size:38px;text-align:center;color:var(--text);
  background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;
}
.numpad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.numkey{
  background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);
  font-family:'Space Mono',monospace;font-size:19px;padding:15px 0;cursor:pointer;
}
.numkey:active{background:var(--card-2);}
.set-done{
  margin:8px 24px;padding:13px 16px;border-radius:14px;min-height:60px;
  display:flex;align-items:center;gap:10px;
}
.set-done.push{background:var(--push-dim);}
.set-done.pull{background:var(--pull-dim);}
.set-done .txt{font-family:'Space Mono',monospace;font-size:15px;}
@keyframes setLoggedPop{
  0%{ transform:scale(.9); opacity:.3; }
  55%{ transform:scale(1.05); opacity:1; }
  100%{ transform:scale(1); opacity:1; }
}
@keyframes setLoggedFlash{
  0%{ box-shadow:0 0 0 0 rgba(244,238,226,.5); }
  100%{ box-shadow:0 0 0 14px rgba(244,238,226,0); }
}
.set-done.just-logged{
  animation: setLoggedPop 1.2s cubic-bezier(.34,1.4,.64,1) both,
             setLoggedFlash 1.35s ease-out both;
}
.bottombar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:14px 24px calc(14px + var(--safe-bottom));
  background:linear-gradient(to top, var(--bg) 70%, transparent);
}
.bottombar-inner{max-width:560px;margin:0 auto;display:flex;gap:10px;}
.bottombar-inner .btn{flex:1;}
.bottom-spacer{height:82px;}
.hero-mini{padding:8px 24px 4px 24px;}
.hero-mini .t{font-family:'Anton',sans-serif;font-size:32px;text-transform:uppercase;line-height:1;}
@keyframes exEnter{
  from{ opacity:0; transform:translateX(28px); }
  to{ opacity:1; transform:translateX(0); }
}
.ex-enter{ animation:exEnter .9s cubic-bezier(.2,.7,.3,1) both; }
.kickoff-overlay{
  position:fixed;inset:0;z-index:100;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:kickoffFade .4s ease-out both;
}
.kickoff-overlay.push{background:radial-gradient(circle at 50% 42%, #FF7E1F 0%, #050302 72%);}
.kickoff-overlay.pull{background:radial-gradient(circle at 50% 42%, var(--pull) 0%, #050302 72%);}
.kickoff-panel{
  position:absolute;top:0;bottom:0;width:50%;
  background:#050302;z-index:2;
  transition:transform 1.55s cubic-bezier(.7,0,.3,1);
}
.kickoff-panel-l{left:0;}
.kickoff-panel-r{right:0;}
.kickoff-eyebrow{
  font-family:'Space Mono',monospace;letter-spacing:.2em;font-size:13px;font-weight:700;text-transform:uppercase;
  animation:kickoffUp .5s .08s cubic-bezier(.16,1,.3,1) both;
}
.kickoff-eyebrow.push{color:var(--push);}
.kickoff-eyebrow.pull{color:var(--pull);}
.kickoff-title{
  font-family:'Anton',sans-serif;font-size:52px;text-transform:uppercase;text-align:center;line-height:1;
  margin-top:12px;padding:0 30px;
  animation:kickoffScale .5s .04s cubic-bezier(.16,1,.3,1) both;
}
.kickoff-title-big{
  font-size:78px;margin-top:0;
}
.kickoff-count{
  font-family:'Anton',sans-serif;font-size:140px;line-height:1;color:var(--text);
  animation:kickoffCountPop .4s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes kickoffCountPop{ from{opacity:0;transform:scale(.5);} to{opacity:1;transform:scale(1);} }
@keyframes kickoffFade{ from{opacity:0;} to{opacity:1;} }
@keyframes kickoffUp{ from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
@keyframes kickoffScale{ from{opacity:0;transform:scale(.85);} to{opacity:1;transform:scale(1);} }
.progress-dots{display:flex;gap:5px;padding:0 24px 4px 24px;}
.progress-dots .d{height:4px;flex:1;border-radius:2px;background:var(--line);}
.progress-dots .d.filled{background:var(--push);}
.progress-dots.pull .d.filled{background:var(--pull);}
.modal-overlay{
  position:fixed;inset:0;background:rgba(6,4,2,.75);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;
}
.modal-sheet{
  background:var(--bg);width:92%;max-width:560px;border-radius:22px;
  max-height:80vh;overflow-y:auto;padding-bottom:24px;
  border:1px solid var(--line);
  animation:modalSheetIn 1s cubic-bezier(.16,1,.3,1) both;
}
@keyframes modalSheetIn{
  from{ opacity:0; transform:scale(.94) translateY(10px); }
  to{ opacity:1; transform:scale(1) translateY(0); }
}
.modal-center{display:flex;align-items:center;justify-content:center;}
.modal-card{
  background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:22px;
  width:88%;max-width:400px;
  animation:modalSheetIn 1s cubic-bezier(.16,1,.3,1) both;
}
.modal-card-smooth{animation:modalSheetIn 1.1s cubic-bezier(.22,.9,.25,1) both;}
.overview-paper{
  margin:6px 6px calc(8px + var(--safe-bottom)) 6px;
  min-height:calc(100vh - var(--safe-top) - 78px);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 18px 40px rgba(28,20,13,.5);
  padding:8px 8px calc(6px + var(--safe-bottom)) 8px;
  overflow:hidden;
}
.overview-paper.paper-plain{
  background:transparent;border:none;box-shadow:none;min-height:0;overflow:visible;
}
.overview-paper.paper-plain .session-ex-block{background:var(--card);}
.overview-paper.paper-plain .session-ex-block.current{background:var(--card-2);}
.session-ex-block{

<body>
<div id="app"></div>
<script>
(function(){
"use strict";

// ---------- storage ----------
const STORAGE_KEY = "jymothy:state";
let state = null;
let nav = [{screen:"home"}];
let wizard = {};
let editRow = null;
let editRowExId = null;
let lastShownExId = null;
let justLoggedKey = null;
let revealDelayKey = null;
let newSetIndex = null;
let planOpenExIds = new Set();
let newPlanExIds = [];
let justToggledExId = null;
let pendingScrollRestore = null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

const DEFAULT_LIBRARY = [
  {id:uid(),name:"Overhead Barbell Press",category:"empujar"},
  {id:uid(),name:"Bench Press",category:"empujar"},
  {id:uid(),name:"Incline Dumbbell Press",category:"empujar"},
  {id:uid(),name:"Dips",category:"empujar"},
  {id:uid(),name:"Push-up",category:"empujar"},
  {id:uid(),name:"Cable Chest Fly",category:"empujar"},
  {id:uid(),name:"Triceps Pushdown",category:"empujar"},
  {id:uid(),name:"Pull-up",category:"tirar"},
  {id:uid(),name:"Lat Pulldown",category:"tirar"},
  {id:uid(),name:"Barbell Row",category:"tirar"},
  {id:uid(),name:"Seated Cable Row",category:"tirar"},
  {id:uid(),name:"Face Pull",category:"tirar"},
  {id:uid(),name:"Barbell Curl",category:"tirar"},
  {id:uid(),name:"Hammer Curl",category:"tirar"},
];

function defaultState(){
  const baselines = {};
  const increments = {};
  DEFAULT_LIBRARY.forEach(ex=>{
    baselines[ex.id] = [
      {weight:20,reps:"10"},
      {weight:20,reps:"10"},
      {weight:20,reps:"10"},
    ];
    increments[ex.id] = 2.5;
  });
  return { library:DEFAULT_LIBRARY, plans:[], baselines, increments, sessions:[], activeSession:null };
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      if(!state.increments) state.increments = {};
      return;
    }
  }catch(e){}
  state = defaultState();
  await saveState();
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error("save failed", e); }
}

// ---------- helpers ----------
function getEx(id){ return state.library.find(e=>e.id===id); }
function guessBodyPart(ex){
  if(ex.bodyPart) return ex.bodyPart;
  const n = ex.name.toLowerCase();
  const has = (...words) => words.some(w=>n.includes(w));
  if(has('bench','chest','pec','fly','flye','dip')) return 'Chest';
  if(has('shoulder','delt','overhead','ohp','military','arnold','raise','press') && !has('bench','leg','chest')) return 'Shoulders';
  if(has('tricep','pushdown','skull','extension') && ex.category==='empujar') return 'Triceps';
  if(has('bicep','curl') && ex.category==='tirar') return 'Biceps';
  if(has('row','pulldown','pull-up','pullup','chin-up','chinup','lat ','back')) return 'Back';
  if(has('squat','leg','lunge','calf','quad','hamstring','glute')) return 'Legs';
  if(has('deadlift')) return 'Back';
  if(has('ab ','abs','core','plank','crunch')) return 'Core';
  return ex.category==='empujar' ? 'Chest' : 'Back';
}
const BODY_PART_ORDER = ['Chest','Shoulders','Triceps','Back','Biceps','Legs','Core'];
function groupByBodyPart(exercises){
  const groups = {};
  exercises.forEach(ex=>{
    const part = guessBodyPart(ex);
    if(!groups[part]) groups[part] = [];
    groups[part].push(ex);
  });
  Object.values(groups).forEach(list=>list.sort((a,b)=>a.name.localeCompare(b.name)));
  const order = [...BODY_PART_ORDER, ...Object.keys(groups).filter(p=>!BODY_PART_ORDER.includes(p)).sort()];
  return order.map(part=>({part, exercises:groups[part]||[]})).filter(g=>g.exercises.length);
}
function getBaseline(id){ return state.baselines[id] || [{weight:0,reps:"10"}]; }
function getIncrement(id){ return state.increments[id] || 2.5; }
function setIncrement(id, val){ state.increments[id] = val; saveState(); }
function parseReps(str){
  const parts = String(str).split("+").map(s=>parseInt(s,10)||0);
  return { segments:parts, total:parts.reduce((a,b)=>a+b,0) };
}
function fmtReps(str){ return String(str).replace('+', ' + '); }
function compareSets(fromSet, toSet){
  if(!fromSet || !toSet) return null;
  if(toSet.weight > fromSet.weight){
    return {type:'weight', from:fromSet.weight, to:toSet.weight};
  }
  if(toSet.weight < fromSet.weight){
    return {type:'weightDown', from:fromSet.weight, to:toSet.weight};
  }
  const fromParsed = parseReps(fromSet.reps);
  const toParsed = parseReps(toSet.reps);
  if(toParsed.total > fromParsed.total){
    return {type:'reps', from:fromSet.reps, to:toSet.reps};
  }
  if(toParsed.total === fromParsed.total
    && toParsed.segments.length>1 && fromParsed.segments.length>1
    && toParsed.segments[0] > fromParsed.segments[0]){
    return {type:'split', from:fromSet.reps, to:toSet.reps};
  }
  return {type:'flat'};
}
function repBarHTML(str, cat){
  const {segments} = parseReps(str);
  const max = 14;
  let html = `<div class="repbar ${cat==='tirar'?'pull':''}">`;
  segments.forEach((seg,i)=>{
    const w = Math.max(6, Math.min(100,(seg/max)*100));
    html += `<div class="seg" style="width:${w}%"></div>`;
    if(i<segments.length-1) html += `<div class="gap">‖</div>`;
  });
  html += `</div>`;
  return html;
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}
function catLabel(c){ return c==='empujar' ? 'EMPUJAR' : 'TIRAR'; }

function push(screen, params){ nav.push({screen,params:params||{}}); render(); window.scrollTo(0,0); }
function pushSwipe(screen, params){
  nav.push({screen,params:params||{}});
  render();
  window.scrollTo(0,0);
  app.classList.add('swipe-card');
  app.style.transformOrigin = 'left center';
  app.style.transition = 'none';
  app.style.transform = 'translateX(-45%)';
  app.style.opacity = '0.5';
  app.offsetHeight;
  app.style.transition = 'transform .95s cubic-bezier(.19,1,.22,1), opacity .5s ease';
  app.style.transform = 'translateX(0)';
  app.style.opacity = '1';
  setTimeout(()=>{
    app.style.transition = '';
    app.style.transform = '';
    app.style.opacity = '';
    app.style.transformOrigin = '';
    app.classList.remove('swipe-card');
  }, 970);
}
function replaceSwipe(screen, params){
  nav[nav.length-1] = {screen,params:params||{}};
  render();
  window.scrollTo(0,0);
  app.classList.add('swipe-card');
  app.style.transformOrigin = 'left center';
  app.style.transition = 'none';
  app.style.transform = 'translateX(-45%)';
  app.style.opacity = '0.5';
  app.offsetHeight;
  app.style.transition = 'transform .95s cubic-bezier(.19,1,.22,1), opacity .5s ease';
  app.style.transform = 'translateX(0)';
  app.style.opacity = '1';
  setTimeout(()=>{
    app.style.transition = '';
    app.style.transform = '';
    app.style.opacity = '';
    app.style.transformOrigin = '';
    app.classList.remove('swipe-card');
  }, 970);
}
function pushExpand(screen, originEl){
  const originRect = originEl.getBoundingClientRect();
  const prevTitleEl = document.querySelector('.topbar .title');
  const prevTitle = prevTitleEl ? prevTitleEl.textContent : '';
  const hadTraining = document.body.classList.contains('training-mode');
  const hadPush = document.body.classList.contains('cat-push');
  const hadPull = document.body.classList.contains('cat-pull');

  const oldLayer = document.createElement('div');
  oldLayer.className = 'expand-old-layer';
  const oldInner = app.cloneNode(true);
  oldLayer.appendChild(oldInner);
  document.body.appendChild(oldLayer);

  nav.push({screen,params:{}});
  render();
  window.scrollTo(0,0);

  const newTitleEl = document.querySelector('.topbar .title');
  const newTitleText = newTitleEl ? newTitleEl.textContent : '';
  if(newTitleEl){
    newTitleEl.textContent = prevTitle;
    newTitleEl.style.transition = 'opacity .4s ease';
  }
  if(hadTraining){
    document.body.classList.add('training-mode');
    if(hadPush) document.body.classList.add('cat-push');
    if(hadPull) document.body.classList.add('cat-pull');
  }

  const paper = app.querySelector('.overview-paper');
  if(!paper){
    if(oldLayer.parentNode) document.body.removeChild(oldLayer);
    if(newTitleEl) newTitleEl.textContent = newTitleText;
    document.body.classList.remove('training-mode','cat-push','cat-pull');
    return;
  }

  paper.classList.add('expand-top-layer');
  const paperRect = paper.getBoundingClientRect();
  const scaleX = Math.max(.06, originRect.width / paperRect.width);
  const scaleY = Math.max(.06, originRect.height / paperRect.height);
  const tx = (originRect.left + originRect.width/2) - (paperRect.left + paperRect.width/2);
  const ty = (originRect.top + originRect.height/2) - (paperRect.top + paperRect.height/2);
  paper.style.transformOrigin = 'center center';
  paper.style.transition = 'none';
  paper.style.transform = `translate(${tx}px, ${ty}px) scale(${scaleX}, ${scaleY})`;
  paper.offsetHeight;
  paper.style.transition = 'transform 1.8s cubic-bezier(.19,1,.22,1)';
  paper.style.transform = 'translate(0,0) scale(1,1)';
  setTimeout(()=>{
    paper.style.transition = '';
    paper.style.transform = '';
    paper.style.transformOrigin = '';
    paper.classList.remove('expand-top-layer');
    if(oldLayer.parentNode) document.body.removeChild(oldLayer);
    const titleElNow = document.querySelector('.topbar .title');
    if(titleElNow){
      titleElNow.style.opacity = '0';
      setTimeout(()=>{
        titleElNow.textContent = newTitleText;
        titleElNow.style.opacity = '1';
        setTimeout(()=>{ titleElNow.style.transition = ''; titleElNow.style.opacity = ''; }, 420);
      }, 400);
    }
    document.body.classList.remove('training-mode','cat-push','cat-pull');
  }, 1850);
}
function pop(){
  if(nav.length>1) nav.pop();
  render();
  window.scrollTo(0,0);
  app.classList.add('swipe-card');
  app.style.transformOrigin = 'left center';
  app.style.transition = 'none';
  app.style.transform = 'translateX(-45%)';
  app.style.opacity = '0.5';
  app.offsetHeight;
  app.style.transition = 'transform .95s cubic-bezier(.19,1,.22,1), opacity .5s ease';
  app.style.transform = 'translateX(0)';
  app.style.opacity = '1';
  setTimeout(()=>{
    app.style.transition = '';
    app.style.transform = '';
    app.style.opacity = '';
    app.style.transformOrigin = '';
    app.classList.remove('swipe-card');
  }, 970);
}
function replace(screen, params){ nav[nav.length-1] = {screen,params:params||{}}; render(); window.scrollTo(0,0); }
function toHome(){
  nav=[{screen:"home"}];
  render();
  window.scrollTo(0,0);
  app.classList.add('swipe-card');
  app.style.transformOrigin = 'left center';
  app.style.transition = 'none';
  app.style.transform = 'translateX(-45%)';
  app.style.opacity = '0.5';
  app.offsetHeight;
  app.style.transition = 'transform .95s cubic-bezier(.19,1,.22,1), opacity .5s ease';
  app.style.transform = 'translateX(0)';
  app.style.opacity = '1';
  setTimeout(()=>{
    app.style.transition = '';
    app.style.transform = '';
    app.style.opacity = '';
    app.style.transformOrigin = '';
    app.classList.remove('swipe-card');
  }, 970);
}
function current(){ return nav[nav.length-1]; }

// ---------- reorder gesture ----------
function getScrollParent(el){
  let p = el.parentElement;
  while(p && p !== document.body){
    const cs = getComputedStyle(p);
    if(/(auto|scroll)/.test(cs.overflowY)) return p;
    p = p.parentElement;
  }
  return null;
}

function makeReorderable(container, itemSelector, {onReorder,onTap,topInset,bottomInset,scrollBoundsEl}){
  topInset = topInset || 0;
  bottomInset = bottomInset || 0;
  container.querySelectorAll(itemSelector).forEach(item=>{
    let timer=null, dragging=false, startX=0, startY=0, moved=false;
    let siblings=[], siblingTops=[], origIndex=0, itemHeight=0, targetIndex=0;
    let scrollParent=null, autoScrollRAF=null, lastClientY=0, initialScrollTop=0;
    let placeholder=null, floatOffsetX=0, floatOffsetY=0;

    item.addEventListener('pointerdown', e=>{
      if(e.target.closest('.nodrag')) return;
      startX=e.clientX; startY=e.clientY; moved=false; dragging=false;
      timer = setTimeout(()=>{
        dragging=true;
        item.classList.add('dragging');
        try{ item.setPointerCapture(e.pointerId); }catch(err){}
        try{ if(navigator.vibrate) navigator.vibrate(12); }catch(err){}

        const allItems = [...container.querySelectorAll(itemSelector)];
        siblings = allItems.filter(it=>it!==item);
        siblingTops = siblings.map(s=>{
          const rr = s.getBoundingClientRect();
          return {top: rr.top, height: rr.height};
        });
        origIndex = allItems.indexOf(item);
        targetIndex = origIndex;
        const r = item.getBoundingClientRect();
        const cs = getComputedStyle(item);
        itemHeight = r.height + parseFloat(cs.marginTop||0) + parseFloat(cs.marginBottom||0);
        scrollParent = scrollBoundsEl || getScrollParent(container);
        initialScrollTop = scrollParent ? scrollParent.scrollTop : 0;

        placeholder = document.createElement('div');
        placeholder.style.height = r.height + 'px';
        placeholder.style.margin = cs.margin;
        placeholder.style.flexShrink = '0';
        placeholder.style.visibility = 'hidden';
        item.parentNode.insertBefore(placeholder, item);

        floatOffsetX = e.clientX - r.left;
        floatOffsetY = e.clientY - r.top;
        item.style.position = 'fixed';
        item.style.left = r.left + 'px';
        item.style.top = r.top + 'px';
        item.style.width = r.width + 'px';
        item.style.margin = '0';
        item.style.zIndex = '999';
        item.style.transition = 'transform .3s cubic-bezier(.16,1,.3,1)';
        item.style.transform = 'scale(1.02)';
        document.body.appendChild(item);
      },320);

      function updateTargetFromPointer(y){
        const scrollDelta = scrollParent ? (scrollParent.scrollTop - initialScrollTop) : 0;
        const buffer = 10;
        let newTarget = siblings.length;
        for(let i=0;i<siblingTops.length;i++){
          const s = siblingTops[i];
          const mid = (s.top - scrollDelta) + s.height/2;
          const threshold = i < targetIndex ? mid - buffer : mid + buffer;
          if(y < threshold){ newTarget = i; break; }
        }
        if(newTarget !== targetIndex){
          targetIndex = newTarget;
          siblings.forEach((sib,i)=>{
            let shift = 0;
            if(origIndex < targetIndex && i>=origIndex && i<targetIndex) shift = -itemHeight;
            else if(origIndex > targetIndex && i>=targetIndex && i<origIndex) shift = itemHeight;
            sib.style.transition = 'transform .5s cubic-bezier(.16,1,.3,1)';
            sib.style.transform = shift ? `translateY(${shift}px)` : '';
          });
        }
      }

      function autoScrollTick(){
        if(!dragging || !scrollParent){ autoScrollRAF = null; return; }
        const sr = scrollParent.getBoundingClientRect();
        const edgeZone = 60;
        const topBound = sr.top + topInset;
        const bottomBound = sr.bottom - bottomInset;
        let delta = 0;
        if(lastClientY < topBound + edgeZone) delta = -Math.ceil((topBound + edgeZone - lastClientY) / 4);
        else if(lastClientY > bottomBound - edgeZone) delta = Math.ceil((lastClientY - (bottomBound - edgeZone)) / 4);
        if(delta !== 0){
          scrollParent.scrollTop += delta;
          updateTargetFromPointer(lastClientY - floatOffsetY + itemHeight/2);
        }
        autoScrollRAF = requestAnimationFrame(autoScrollTick);
      }

      function onMove(ev){
        if(Math.abs(ev.clientX-startX)>10 || Math.abs(ev.clientY-startY)>10){
          if(!moved && !dragging) clearTimeout(timer);
          moved=true;
        }
        if(!dragging) return;
        ev.preventDefault();
        lastClientY = ev.clientY;
        item.style.transition = 'transform 0s';
        item.style.left = (ev.clientX - floatOffsetX) + 'px';
        item.style.top = (ev.clientY - floatOffsetY) + 'px';
        item.style.transform = 'scale(1.02)';
        updateTargetFromPointer(ev.clientY - floatOffsetY + itemHeight/2);
        if(!autoScrollRAF) autoScrollRAF = requestAnimationFrame(autoScrollTick);
      }
      function onUp(ev){
        clearTimeout(timer);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        if(autoScrollRAF){ cancelAnimationFrame(autoScrollRAF); autoScrollRAF=null; }
        if(dragging){
          item.style.position = '';
          item.style.left = '';
          item.style.top = '';
          item.style.width = '';
          item.style.margin = '';
          item.style.zIndex = '';
          item.style.transform = '';
          item.style.transition = '';
          placeholder.parentNode.insertBefore(item, placeholder);
          placeholder.remove();
          container.insertBefore(item, siblings[targetIndex] || null);
          siblings.forEach(sib=>{
            sib.style.transition = 'transform .48s cubic-bezier(.16,1,.3,1)';
            sib.style.transform = '';
          });
          setTimeout(()=>{
            item.classList.remove('dragging');
          }, 480);
          const ids = [...container.querySelectorAll(itemSelector)].map(it=>it.dataset.id);
          onReorder && onReorder(ids);
        } else if(!moved){
          onTap && onTap(item.dataset.id);
        }
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}

const app = document.getElementById('app');
function render(){
  const {screen, params} = current();
  const renderers = {
    home: renderHome,
    planList: renderPlanList,
    planNewCategory: renderPlanNewCategory,
    planNewExercises: renderPlanNewExercises,
    planDetail: renderPlanDetail,
    planAddExercises: renderPlanAddExercises,
    exerciseEditor: renderExerciseEditor,
    sessionPick: renderSessionPick,
    sessionRunner: renderSessionRunner,
    sessionOverview: renderSessionOverview,
    sessionSummary: renderSessionSummary,
    trainingLog: renderTrainingLog,
    progressList: renderProgressList,
    progressDetail: renderProgressDetail,
  };
  const inTraining = screen==='sessionRunner' && state.activeSession;
  document.body.classList.toggle('training-mode', !!inTraining);
  document.body.classList.toggle('cat-push', !!inTraining && state.activeSession.category==='empujar');
  document.body.classList.toggle('cat-pull', !!inTraining && state.activeSession.category==='tirar');
  const sessionScreens = ['sessionRunner','sessionOverview'];
  const isSessionTheme = sessionScreens.includes(screen) && !!state.activeSession;
  document.body.classList.toggle('session-theme', isSessionTheme);
  document.documentElement.classList.toggle('session-theme', isSessionTheme);
  app.innerHTML = "";

}

// Reusable slot-card builder (same design as the home menu cards) for plan/session lists.
function buildSlotCard(container, catClass, title, desc, onActivate){
  const slot = document.createElement('div');
  slot.className = `menu-slot ${catClass}`;
  const el = document.createElement('div');
  el.className = `card menu ${catClass}`;
  el.innerHTML = `<div class="ct"><div class="t">${title}</div><div class="d">${desc}</div></div><div class="chev">›</div>`;
  el.addEventListener('click', ()=>{
    container.querySelectorAll('.menu-slot').forEach(otherSlot=>{

      else otherSlot.classList.add('slot-dim');

  });
  slot.appendChild(el);
  container.appendChild(slot);
  return slot;

function renderPlanExEditBody(ex, exId, plan, cat){
  const sets = getBaseline(exId);
  const setsHTML = sets.map((s,si)=>{
    const {segments} = parseReps(s.reps);
    let repsHTML = `<button class="numfield-plain nodrag" data-pfield="repsA" data-exid="${exId}" data-si="${si}">${segments[0]}</button>`;
    let pauseLabel = '+';
    if(segments.length>1){
      repsHTML += `<span class="x nodrag">+</span><button class="numfield-plain nodrag" data-pfield="repsB" data-exid="${exId}" data-si="${si}">${segments[1]}</button>`;
      pauseLabel = '−';
    }
    return `<div class="set-edit set-edit-boxed nodrag" style="margin:4px 0;">
      <span class="set-num">${si+1}</span>
      <button class="numfield-plain nodrag" data-pfield="weight" data-exid="${exId}" data-si="${si}">${s.weight}kg</button>
      <span class="x nodrag">×</span>
      ${repsHTML}
      <span class="dc-group">
        <button class="pausebtn pausebtn-fixed nodrag" data-pausesi="${si}" data-exid="${exId}">${pauseLabel}</button>
        <span class="delsetbtn delsetbtn-x nodrag" data-delsi="${si}" data-exid="${exId}">×</span>
      </span>
    </div>`;
  }).join('');
  return `<div class="sx-planedit nodrag">
    <div style="margin-top:2px;">${setsHTML}</div>
    <button class="btn ghost small nodrag btn-press" data-addset="${exId}" style="width:100%;margin-top:8px;">+ Add set</button>
    <button class="btn ghost small nodrag btn-press" data-removeex="${exId}" style="width:100%;margin-top:8px;color:var(--danger)">Remove from plan</button>
  </div>`;
}

function bindPlanExEditBody(list, plan){
  list.querySelectorAll('[data-incval]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      setIncrement(chip.dataset.exid, parseFloat(chip.dataset.incval));
      render();
    });
  });
  list.querySelectorAll('[data-pfield]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const exId = btn.dataset.exid, si = btn.dataset.si, field = btn.dataset.pfield;
      const sets = getBaseline(exId);
      if(field==='weight'){
        openNumpad(sets[si].weight, 'Weight (kg)', true, v=>{
          const s2 = getBaseline(exId);
          s2[si].weight = v; state.baselines[exId] = s2;
          saveState(); render();
        });
      } else if(field==='repsA'){
        const {segments} = parseReps(sets[si].reps);
        openNumpad(segments[0], 'Reps', false, v=>{
          const s2 = getBaseline(exId);
          const {segments:seg2} = parseReps(s2[si].reps);
          const newA = Math.round(v);
          if(seg2.length>1){
            const total = seg2[0]+seg2[1];
            seg2[0] = newA; seg2[1] = Math.max(0, total-newA);
          } else {
            seg2[0] = newA;
          }
          s2[si].reps = seg2.join('+');
          state.baselines[exId] = s2;
          saveState(); render();
        });
      } else if(field==='repsB'){
        const {segments} = parseReps(sets[si].reps);
        openNumpad(segments[1], 'Reps after pause', false, v=>{
          const s2 = getBaseline(exId);
          const {segments:seg2} = parseReps(s2[si].reps);
          const newB = Math.round(v);
          const total = seg2[0]+seg2[1];
          seg2[1] = newB; seg2[0] = Math.max(0, total-newB);
          s2[si].reps = seg2.join('+');
          state.baselines[exId] = s2;
          saveState(); render();
        });
      }
    });
  });
  list.querySelectorAll('.pausebtn[data-pausesi]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const exId = btn.dataset.exid, si = btn.dataset.pausesi;
      const sets = getBaseline(exId);
      const {segments} = parseReps(sets[si].reps);
      if(segments.length>1){
        sets[si].reps = String(segments[0]+segments[1]);
      } else {
        const total = segments[0];
        const second = total>2 ? 2 : 1;
        const first = Math.max(1, total-second);
        sets[si].reps = `${first}+${second}`;
      }
      state.baselines[exId] = sets;
      saveState(); render();
    });
  });
  list.querySelectorAll('[data-delsi]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const exId = btn.dataset.exid, si = parseInt(btn.dataset.delsi);
      const sets = getBaseline(exId);
      sets.splice(si,1);
      state.baselines[exId] = sets;
      saveState(); render();
    });
  });
  list.querySelectorAll('[data-addset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const exId = btn.dataset.addset;
      const sets = getBaseline(exId);
      const last = sets[sets.length-1] || {weight:20,reps:"10"};
      sets.push({weight:last.weight, reps:last.reps});
      state.baselines[exId] = sets;
      saveState(); render();
    });
  });
  list.querySelectorAll('[data-removeex]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const exId = btn.dataset.removeex;
      openConfirm('Are you sure you want to delete the set?', ()=>{
        const row = list.querySelector(`.session-ex-block[data-id="${exId}"]`);
        if(row){
          row.style.overflow = 'hidden';

}

function attachSlowSnapScroll(scrollArea, itemSelector, visibleCount){
  scrollArea.style.scrollSnapType = 'y mandatory';
  scrollArea.style.scrollBehavior = 'smooth';
  requestAnimationFrame(()=>{
    const items = [...scrollArea.querySelectorAll(itemSelector)];
    if(items.length===0) return;
    items.forEach(item=>{ item.style.scrollSnapAlign = 'start'; item.style.scrollSnapStop = 'always'; });
    if(visibleCount && items.length > visibleCount){
      const scrollAreaTop = scrollArea.getBoundingClientRect().top;
      const boundaryItem = items[visibleCount];
      const boundaryTop = boundaryItem.getBoundingClientRect().top;
      const exactHeight = (boundaryTop - scrollAreaTop) + scrollArea.scrollTop;
      scrollArea.style.maxHeight = exactHeight + 'px';
    }
  });
}

function playBeep(freq, dur, vol){
  try{
    const ctx = window.__jymAudioCtx || (window.__jymAudioCtx = new (window.AudioContext||window.webkitAudioContext)());
    if(ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(vol||0.22, now+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur/1000);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur/1000 + 0.03);
  }catch(e){}
}

function playGong(){
  try{
    const ctx = window.__jymAudioCtx || (window.__jymAudioCtx = new (window.AudioContext||window.webkitAudioContext)());
    if(ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    const partials = [220, 328, 442, 585];
    partials.forEach((f,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      const vol = 0.26 / (i+1);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(vol, now+0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.6);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 1.65);
    });
  }catch(e){}
}

function startSession(plan){
  if(plan.exerciseIds.length===0){ openAlert('This plan has no exercises yet.'); return; }
  const exercisesState = {};
  const originalBaselines = {};
  plan.exerciseIds.forEach(id=>{
    const bl = getBaseline(id);
    exercisesState[id] = { sets: bl.map(s=>({weight:s.weight, reps:s.reps, done:false})) };
    originalBaselines[id] = bl.map(s=>({weight:s.weight, reps:s.reps}));
  });
  state.activeSession = {
    id:uid(), planId:plan.id, planName:plan.name, category:plan.category,
    startedAt:new Date().toISOString(),
    exerciseOrder:[...plan.exerciseIds],
    currentIndex:0,
    exercisesState,
    originalBaselines,
  };
  saveState();
  editRow = null; editRowExId = null; lastShownExId = null; justLoggedKey = null; revealDelayKey = null; newSetIndex = null;
  nav = [{screen:'home'},{screen:'sessionRunner'}];
  render();
  window.scrollTo(0,0);
  app.style.transition = 'none';
  app.style.opacity = '0';
  app.style.transform = 'scale(.96)';
  app.offsetHeight;
  app.style.transition = 'opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1)';
  app.style.opacity = '1';
  app.style.transform = 'scale(1)';
  setTimeout(()=>{
    app.style.transition = '';
    app.style.opacity = '';
    app.style.transform = '';
  }, 620);
}

function renderSessionRunner(){
  const s = state.activeSession;
  if(!s){ toHome(); return; }
  const cat = s.category;
  topbar(s.planName, toHome);

  const total = s.exerciseOrder.length;
  const idx = Math.min(s.currentIndex, total-1);
  const exId = s.exerciseOrder[idx];
  const ex = getEx(exId);
  const exState = s.exercisesState[exId];

  const advanced = (lastShownExId !== null) && (lastShownExId !== exId);
  lastShownExId = exId;

  const dots = document.createElement('div');
  dots.className=`progress-dots ${cat==='tirar'?'pull':''}`;
  s.exerciseOrder.forEach((id,i)=>{
    const d = document.createElement('div');
    d.className = 'd'+(i<=idx?' filled':'');
    dots.appendChild(d);
  });
  app.appendChild(dots);

  const hero = document.createElement('div');
  hero.className='hero-mini px'+(advanced?' ex-enter':'');
  hero.innerHTML = `<div class="eyebrow ${cat==='empujar'?'push':'pull'}">Exercise ${idx+1} of ${total}</div>
    <div class="t">${ex ? ex.name : '—'}</div>`;
  app.appendChild(hero);

  const list = document.createElement('div');
  list.id='runnerSets';
  if(advanced) list.className='ex-enter';
  if(editRowExId !== exId){ editRow = null; editRowExId = exId; }

  function maybeAdvance(){
    const complete = exState.sets.length===0 || exState.sets.every(x=>x.done);
    saveState();
    if(!complete){
      render();
      if(revealDelayKey){
        setTimeout(()=>{ revealDelayKey = null; render(); }, 1300);
      }
      return;
    }
    const delay = justLoggedKey ? 1300 : 0;
    render();
    setTimeout(()=>{
      if(s.currentIndex < total-1){ s.currentIndex++; saveState(); render(); window.scrollTo(0,0); }
      else { finishSession(); }
    }, delay);
  }

  let blocked = false;
  exState.sets.forEach((s2,i)=>{
    const {segments} = parseReps(s2.reps);
    const row = document.createElement('div');
    if(s2.done){
      const justLogged = justLoggedKey === `${exId}:${i}`;
      row.className='set-done '+(cat==='tirar'?'pull':'push')+(justLogged?' just-logged':'');
      row.innerHTML = `<span class="set-num">${i+1}</span><span class="txt">${s2.weight} kg × ${fmtReps(s2.reps)}</span>`;
      row.dataset.i = i;
      if(justLogged) justLoggedKey = null;
    } else if(editRow===i){
      row.className='set-edit set-edit-boxed set-edit-session';
      const stepCls = cat==='tirar'?'pull':'push';
      let repsHTML = `<button class="numfield-plain" data-field="repsA" data-i="${i}">${segments[0]}</button>`;
      let pauseLabel = '+';
      if(segments.length>1){
        repsHTML += `<span class="x">+</span><button class="numfield-plain" data-field="repsB" data-i="${i}">${segments[1]}</button>`;
        pauseLabel = '−';
      }
      row.innerHTML = `
        <span class="set-num">${i+1}</span>
        <button class="numfield-plain" data-field="weight" data-i="${i}">${s2.weight} kg</button>
        <span class="x">×</span>
        ${repsHTML}
        <span class="dc-group">
          <button class="pausebtn pausebtn-fixed" data-i="${i}">${pauseLabel}</button>
          <span class="delsetbtn delsetbtn-x" data-i="${i}">×</span>
        </span>`;
      blocked = true;
    } else {
      const suppressed = i>0 && exState.sets[i-1].done && revealDelayKey===`${exId}:${i-1}`;
      const canLog = !blocked && !suppressed;
      const isNew = newSetIndex === i;
      row.className='set-line'+` ${cat==='tirar'?'pull':'push'}`+(isNew?' set-new':'');
      row.innerHTML = `
        <span class="set-num">${i+1}</span>
        <span class="set-summary" data-i="${i}">${s2.weight} kg × ${fmtReps(s2.reps)}</span>
        <button class="logcheck ${cat==='tirar'?'pull':'push'}${canLog?'':' invisible'}" data-i="${i}">✓</button>`;
      blocked = true;
      if(isNew) newSetIndex = null;
    }
    list.appendChild(row);
  });
  app.appendChild(list);

  list.querySelectorAll('.set-summary').forEach(el=>el.addEventListener('click',()=>{
    editRow = parseInt(el.dataset.i); render();
  }));
  list.querySelectorAll('.set-line').forEach(row=>{
    const summary = row.querySelector('.set-summary');
    if(!summary) return;
    summary.addEventListener('pointerdown', ()=>row.classList.add('pressed'));
    summary.addEventListener('pointerup', ()=>row.classList.remove('pressed'));
    summary.addEventListener('pointerleave', ()=>row.classList.remove('pressed'));
    summary.addEventListener('pointercancel', ()=>row.classList.remove('pressed'));
  });
  list.querySelectorAll('.set-edit-session').forEach(row=>{
    row.addEventListener('click', ()=>{ editRow = null; render(); });
    const isInteractive = e=>e.target.closest('.numfield-plain, .pausebtn, .delsetbtn');
    row.addEventListener('pointerdown', (e)=>{ if(!isInteractive(e)) row.classList.add('pressed'); });
    row.addEventListener('pointerup', ()=>row.classList.remove('pressed'));
    row.addEventListener('pointerleave', ()=>row.classList.remove('pressed'));
    row.addEventListener('pointercancel', ()=>row.classList.remove('pressed'));
  });
  list.querySelectorAll('.numfield-plain').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    const i = el.dataset.i, field = el.dataset.field;
    if(field==='weight'){
      openNumpad(exState.sets[i].weight, 'Weight (kg)', true, v=>{
        exState.sets[i].weight = v; saveState(); render();
      });
    } else if(field==='repsA'){
      const {segments} = parseReps(exState.sets[i].reps);
      openNumpad(segments[0], 'Reps', false, v=>{
        const {segments} = parseReps(exState.sets[i].reps);
        const newA = Math.round(v);
        if(segments.length>1){
          const total = segments[0]+segments[1];
          segments[0] = newA;
          segments[1] = Math.max(0, total-newA);
        } else {
          segments[0] = newA;
        }
        exState.sets[i].reps = segments.join('+');
        saveState(); render();
      });
    } else if(field==='repsB'){
      const {segments} = parseReps(exState.sets[i].reps);
      openNumpad(segments[1], 'Reps after pause', false, v=>{
        const {segments} = parseReps(exState.sets[i].reps);
        const newB = Math.round(v);
        const total = segments[0]+segments[1];
        segments[1] = newB;
        segments[0] = Math.max(0, total-newB);
        exState.sets[i].reps = segments.join('+');
        saveState(); render();
      });
    }
  }));
  list.querySelectorAll('.pausebtn').forEach(btn=>btn.addEventListener('click',(e)=>{
    e.stopPropagation();
    const i=btn.dataset.i; const {segments}=parseReps(exState.sets[i].reps);
    if(segments.length>1){
      exState.sets[i].reps = String(segments[0]+segments[1]);
    } else {
      const total = segments[0];
      const second = total>2 ? 2 : 1;
      const first = Math.max(1, total-second);
      exState.sets[i].reps = `${first}+${second}`;
    }
    saveState(); render();
  }));
  list.querySelectorAll('.delsetbtn').forEach(btn=>btn.addEventListener('click',(e)=>{
    e.stopPropagation();
    const i=parseInt(btn.dataset.i);
    const row = btn.closest('.set-edit');
    const doDelete = ()=>{
      exState.sets.splice(i,1);
      if(editRow===i) editRow=null;
      maybeAdvance();
      requestAnimationFrame(()=>{
        const newAddBtn = document.getElementById('addRunnerSetBtn');
        const newAddRow = newAddBtn ? newAddBtn.parentElement : null;
        if(newAddRow){
          newAddRow.style.transition = 'none';
          newAddRow.style.transform = 'translateY(48px)';
          newAddRow.style.opacity = '0.3';
          newAddRow.offsetHeight;
          newAddRow.style.transition = 'transform 1.2s cubic-bezier(.16,1,.3,1), opacity .9s ease';
          newAddRow.style.transform = 'translateY(0)';
          newAddRow.style.opacity = '1';
          setTimeout(()=>{
            newAddRow.style.transition = '';
            newAddRow.style.transform = '';
            newAddRow.style.opacity = '';
          }, 1220);
        }
      });
    };
    if(row){
      row.style.overflow = 'hidden';
      row.style.transition = 'opacity .4s ease, max-height .4s ease, margin .4s ease, transform .4s ease';
      row.style.maxHeight = row.offsetHeight + 'px';
      row.offsetHeight;
      row.style.opacity = '0';
      row.style.transform = 'scale(.96)';
      row.style.maxHeight = '0px';
      row.style.marginTop = '0px';
      row.style.marginBottom = '0px';
      setTimeout(doDelete, 400);
    } else {
      doDelete();
    }
  }));
  list.querySelectorAll('.logcheck').forEach(btn=>btn.addEventListener('click',()=>{
    const i=btn.dataset.i;
    exState.sets[i].done = !exState.sets[i].done;
    justLoggedKey = `${exId}:${i}`;
    revealDelayKey = `${exId}:${i}`;
    editRow = null;
    playBeep(880, 90, 0.18);
    setTimeout(()=>playBeep(1320, 140, 0.16), 70);
    maybeAdvance();
  }));

  const addSetRow = document.createElement('div');
  addSetRow.className='px'+(advanced?' ex-enter':'');
  addSetRow.style.marginTop='4px';
  addSetRow.innerHTML = `<button class="btn ghost small btn-press" id="addRunnerSetBtn">+ Add set</button>`;
  app.appendChild(addSetRow);
  addSetRow.querySelector('#addRunnerSetBtn').addEventListener('click', ()=>{
    const last = exState.sets[exState.sets.length-1] || {weight:20,reps:"10"};
    exState.sets.push({weight:last.weight, reps:last.reps, done:false});
    newSetIndex = exState.sets.length-1;
    saveState(); render();
  });

  const spacer = document.createElement('div');
  spacer.className='bottom-spacer';
  app.appendChild(spacer);

  const bottomBar = document.createElement('div');
  bottomBar.className='bottombar';
  bottomBar.innerHTML = `<div class="bottombar-inner${advanced?' ex-enter':''}">
      <button class="btn ghost small btn-press" id="zoomBtn">Overview</button>
      <button class="btn ghost small btn-press" id="finishBtn">End session</button>
    </div>`;
  app.appendChild(bottomBar);
  bottomBar.querySelector('#zoomBtn').addEventListener('click', (e)=>pushExpand('sessionOverview', e.currentTarget));
  bottomBar.querySelector('#finishBtn').addEventListener('click', ()=>{

function openSheetSyncModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay modal-center';
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="field-label">Google Sheet sync</div>
      <input type="text" class="namefield" style="margin:0 0 10px 0;width:100%" id="sheetUrlInput" placeholder="Paste your Apps Script Web App URL" value="${state.sheetSyncUrl||''}">
      <div class="sub" style="margin-bottom:14px">Reads Name (col A), Category (col B: empujar/tirar), and Body Part (col C, e.g. Chest/Back/Legs) from your sheet, skipping the header row.</div>
      <button class="btn primary btn-press" id="syncNowBtn" style="margin-bottom:8px">Sync now</button>
      <button class="btn ghost btn-press" id="removeStartersBtn" style="margin-bottom:8px;color:var(--danger)">Remove starter exercises</button>
      <button class="btn ghost btn-press" id="closeSyncBtn">Close</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeSyncBtn').addEventListener('click', ()=>document.body.removeChild(overlay));
  overlay.querySelector('#removeStartersBtn').addEventListener('click', ()=>{
    openConfirm('Remove the built-in starter exercises? Only ones you added yourself (including via Sheet sync) will remain.', ()=>{
      const starterNames = new Set(DEFAULT_LIBRARY.map(e=>e.name.toLowerCase()));
      const toRemove = state.library.filter(e=>starterNames.has(e.name.toLowerCase()));
      const removeIds = new Set(toRemove.map(e=>e.id));
      state.library = state.library.filter(e=>!removeIds.has(e.id));
      state.plans.forEach(p=>{ p.exerciseIds = p.exerciseIds.filter(id=>!removeIds.has(id)); });
      removeIds.forEach(id=>{ delete state.baselines[id]; delete state.increments[id]; });
      saveState();
      document.body.removeChild(overlay);
      openAlert(`Removed ${toRemove.length} starter exercise${toRemove.length===1?'':'s'}.`);
      render();
    }, 'Remove');
  });
  overlay.querySelector('#syncNowBtn').addEventListener('click', async ()=>{
    const url = overlay.querySelector('#sheetUrlInput').value.trim();
    if(!url) return;
    state.sheetSyncUrl = url;
    saveState();
    const btn = overlay.querySelector('#syncNowBtn');
    btn.textContent = 'Syncing…';
    btn.disabled = true;
    try{
      const res = await fetch(url);
      const data = await res.json();
      let added = 0, updated = 0;
      data.forEach(row=>{
        const name = String(row.name||'').trim();
        let category = String(row.category||'').trim().toLowerCase();
        let bodyPart = String(row.bodyPart||'').trim();
        if(bodyPart) bodyPart = bodyPart.charAt(0).toUpperCase() + bodyPart.slice(1).toLowerCase();
        if(!name) return;
        if(category!=='empujar' && category!=='tirar') category = 'empujar';
        const existing = state.library.find(e=>e.name.toLowerCase()===name.toLowerCase());
        if(existing){
          let changed = false;
          if(existing.category !== category){ existing.category = category; changed = true; }
          if(bodyPart && existing.bodyPart !== bodyPart){ existing.bodyPart = bodyPart; changed = true; }
          if(changed) updated++;
        } else {
          const newEx = {id:uid(), name, category};
          if(bodyPart) newEx.bodyPart = bodyPart;
          state.library.push(newEx);
          state.baselines[newEx.id] = [{weight:20,reps:"10"},{weight:20,reps:"10"},{weight:20,reps:"10"}];
          added++;
        }
      });
      saveState();
      document.body.removeChild(overlay);
      openAlert(`Synced: ${added} added, ${updated} updated.`);
      render();
    }catch(err){
      btn.textContent = 'Sync now';
      btn.disabled = false;
      openAlert('Could not sync. Check the URL and that the sheet is published correctly.');
    }
  });
}

function openNumpad(initial, title, allowDecimal, onConfirm){
  let val = (initial===null||initial===undefined||initial===0) ? '' : String(initial);
  let freshStart = true;
  const overlay = document.createElement('div');
  overlay.className='modal-overlay modal-center';
  const card = document.createElement('div');
  card.className = 'modal-card numpad-card';
  overlay.appendChild(card);
  function draw(){
    const keys = ['1','2','3','4','5','6','7','8','9', allowDecimal?'.':'', '0','del'];
    card.innerHTML = `
      <div class="field-label">${title}</div>
      <div class="numpad-display">${val===''?'0':val}</div>
      <div class="numpad-grid">
        ${keys.map(k=>{
          if(k==='') return `<span></span>`;
          if(k==='del') return `<button class="numkey" data-k="del">⌫</button>`;
          return `<button class="numkey" data-k="${k}">${k}</button>`;
        }).join('')}
      </div>
      <button class="btn primary" id="numEnter" style="margin-top:12px">Enter</button>
    `;
    card.querySelectorAll('.numkey').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const k = btn.dataset.k;
        if(k==='del'){
          val = val.slice(0,-1);
        } else if(k==='.'){
          if(freshStart){ val=''; freshStart=false; }
          if(!val.includes('.')) val += (val===''?'0.':'.');
        } else {
          if(freshStart){ val=''; freshStart=false; }
          if(val.length<6) val += k;
        }
        draw();
      });
    });
    card.querySelector('#numEnter').addEventListener('click', ()=>{
      document.body.removeChild(overlay);
      onConfirm(parseFloat(val)||0);
    });
  }
  draw();
  document.body.appendChild(overlay);
}

function finishSession(){
  const s = state.activeSession;
  const plan = state.plans.find(p=>p.id===s.planId);
  const loggedExercises = [];
  const bumps = [];
  const origBaselines = s.originalBaselines || {};

  s.exerciseOrder.forEach(exId=>{
    const ex = getEx(exId);
    const st = s.exercisesState[exId];
    const doneSets = st.sets.filter(x=>x.done);
    if(doneSets.length===0) return;
    loggedExercises.push({ exerciseId:exId, name:ex.name, sets:doneSets.map(x=>({weight:x.weight,reps:x.reps})) });

    // auto-progression: if all baseline sets were completed as done and the
    // heaviest (last) set had no pause split, bump weights slightly next time.
    // (this only affects the NEXT session's starting numbers, not this summary)
    const baseline = getBaseline(exId);
    const allDone = st.sets.length>0 && st.sets.every(x=>x.done);
    const last = st.sets[st.sets.length-1];
    if(allDone && last && !String(last.reps).includes('+')){
      const newBaseline = baseline.map(b=>({weight: Math.round((b.weight+2.5)*10)/10, reps:b.reps}));
      state.baselines[exId] = newBaseline;
    }

    // manual improvement: did the person log more weight or more reps than
    // the plan's starting numbers on any set, during THIS session?
    const origSets = origBaselines[exId] || [];
    for(let i=0;i<st.sets.length;i++){
      const cur = st.sets[i];
      const orig = origSets[i];
      if(!orig) continue;
      if(cur.weight > orig.weight){
        bumps.push({exerciseId:exId, name:ex.name, from:orig.weight, to:cur.weight});
        break;
      }
      const origParsed = parseReps(orig.reps);
      const curParsed = parseReps(cur.reps);
      if(cur.weight === orig.weight && curParsed.total > origParsed.total){
        bumps.push({exerciseId:exId, name:ex.name, fromReps:orig.reps, toReps:cur.reps});
        break;
      }
      // same weight, same total reps, but a stronger split (more reps done
      // before the pause) still counts as an improvement, e.g. 7+3 -> 8+2
      if(cur.weight === orig.weight && curParsed.total === origParsed.total
        && curParsed.segments.length>1 && origParsed.segments.length>1
        && curParsed.segments[0] > origParsed.segments[0]){
        bumps.push({exerciseId:exId, name:ex.name, fromReps:orig.reps, toReps:cur.reps});
        break;
      }
    }
  });

  const session = {
    id:s.id, planId:s.planId, planName:s.planName, category:s.category,
    date:new Date().toISOString(), exercises:loggedExercises,
  };
  state.sessions.unshift(session);
  state.activeSession = null;
  saveState();
  nav = [{screen:'home'},{screen:'sessionSummary'}];
  wizard.lastBumps = bumps;
  wizard.lastSession = session;
  render();
  window.scrollTo(0,0);
}

function renderProgressList(){
  topbar('Progress', toHome);

  const pageWrap = document.createElement('div');
  pageWrap.style.display = 'flex';
  pageWrap.style.flexDirection = 'column';
  app.appendChild(pageWrap);

  const hero = document.createElement('div');
  hero.className='hero-mini px';
  hero.style.flexShrink = '0';
  hero.style.paddingBottom = '0';
  hero.innerHTML = `<div class="t">Your progress</div>`;
  pageWrap.appendChild(hero);

  const exIds = new Set();
  state.sessions.forEach(s=>s.exercises.forEach(ex=>exIds.add(ex.exerciseId)));
  if(exIds.size===0){
    const e = document.createElement('div');
    e.className='empty';
    e.innerHTML = `<div class="big">No data yet</div>Log sessions to see your progress per exercise.`;
    pageWrap.appendChild(e);
    return;
  }

  const spacer = document.createElement('div');
  spacer.style.height = '22px';
  spacer.style.flexShrink = '0';
  pageWrap.appendChild(spacer);

  const scrollArea = document.createElement('div');
  scrollArea.style.flex = '1';
  scrollArea.style.minHeight = '0';
  scrollArea.style.boxSizing = 'border-box';
  scrollArea.style.overflowY = 'auto';
  scrollArea.style.webkitOverflowScrolling = 'touch';
  pageWrap.appendChild(scrollArea);

  const buildRow = exId=>{
    const ex = getEx(exId);
    if(!ex) return null;
    const history = state.sessions.filter(s=>s.exercises.some(e=>e.exerciseId===exId))
      .map(s=>({date:s.date, ex:s.exercises.find(e=>e.exerciseId===exId)}))
      .sort((a,b)=>new Date(a.date)-new Date(b.date));
    const first = history[0];
    const last = history[history.length-1];
    const firstSet = first.ex.sets[first.ex.sets.length-1];
    const lastSet = last.ex.sets[last.ex.sets.length-1];
    const cmp = compareSets(firstSet, lastSet);
    let deltaHTML;
    if(!cmp || cmp.type==='flat'){
      deltaHTML = `<div class="delta flat">–</div>`;
    } else if(cmp.type==='weight'){
      deltaHTML = `<div class="delta">+${Math.round((cmp.to-cmp.from)*10)/10}kg</div>`;
    } else if(cmp.type==='weightDown'){
      deltaHTML = `<div class="delta flat">${Math.round((cmp.to-cmp.from)*10)/10}kg</div>`;
    } else {
      deltaHTML = `<div class="delta">${fmtReps(cmp.from)} → ${fmtReps(cmp.to)}</div>`;
    }
    const row = document.createElement('div');
    row.className='progress-item';
    row.innerHTML = `<div class="n">${ex.name}</div>${deltaHTML}`;
    row.addEventListener('click', ()=>push('progressDetail',{exerciseId:exId}));
    return row;
  };

  const bodyPartOrder = ['Chest','Shoulders','Triceps','Back','Biceps','Legs','Core'];
  const groups = {};
  [...exIds].forEach(exId=>{
    const ex = getEx(exId);
    if(!ex) return;
    const part = guessBodyPart(ex);
    if(!groups[part]) groups[part] = [];
    groups[part].push(exId);
  });

  bodyPartOrder.forEach(part=>{
    const ids = groups[part];
    if(!ids || !ids.length) return;
    const lbl = document.createElement('div');
    lbl.className='section-label';
    lbl.textContent = part;
    lbl.style.scrollSnapAlign = 'start';
    lbl.style.scrollSnapStop = 'always';
    scrollArea.appendChild(lbl);
    ids.forEach(exId=>{ const row = buildRow(exId); if(row) scrollArea.appendChild(row); });
  });

  const firstRow = scrollArea.querySelector('.progress-item');
  if(firstRow) firstRow.style.marginTop = '0';
  attachSlowSnapScroll(scrollArea, '.progress-item', 9);

  requestAnimationFrame(()=>{
    const top = pageWrap.getBoundingClientRect().top;
    const appBottomPad = parseFloat(getComputedStyle(app).paddingBottom) || 0;
    pageWrap.style.height = `calc(100vh - ${top}px - ${appBottomPad}px)`;
  });
}

  const hero = document.createElement('div');

  hero.innerHTML = `<div class="eyebrow ${ex.category==='empujar'?'push':'pull'}">${catLabel(ex.category)}</div><div class="t">${ex.name}</div>`;
  app.appendChild(hero);

  const history = state.sessions.filter(s=>s.exercises.some(e=>e.exerciseId===exerciseId))
    .map(s=>({date:s.date, ex:s.exercises.find(e=>e.exerciseId===exerciseId)}))
    .sort((a,b)=>new Date(b.date)-new Date(a.date));

  if(history.length>=2){
    const first = history[history.length-1].ex;
    const last = history[0].ex;
    const fw = first.sets[first.sets.length-1].weight;
    const lw = last.sets[last.sets.length-1].weight;
    const note = document.createElement('div');
    note.className='banner';
    note.innerHTML = `<div><div class="t">${fw}kg → ${lw}kg</div><div class="s">Since ${fmtDate(history[history.length-1].date)}</div></div>`;
    app.appendChild(note);
  }

  const wrap = document.createElement('div');
  wrap.className='px';
  wrap.style.marginTop='10px';
  history.forEach(h=>{
    const row = document.createElement('div');
    row.className='hist-row';
    row.innerHTML = `<span class="dt">${fmtDate(h.date)}</span><span>${h.ex.sets.map(s=>`${s.weight}×${fmtReps(s.reps)}`).join('  ')}</span>`;
    wrap.appendChild(row);
  });
  app.appendChild(wrap);
}

// ---------- boot ----------
(async function boot(){
  app.innerHTML = `<div class="centered-note">Loading JYMOTHY…</div>`;
  await loadState();
  render();
})();

})();
</script>
</body>
</html>
